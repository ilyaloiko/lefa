<div class="letters-container">

  <div class="letters-container-header">
    <div class="buttons-container">
      <app-button [icon]="'keyboard_arrow_left'"
                  (clickEventEmitter)="menu()">
      </app-button>
      <app-button [appDisabled]="isStartMode()"
                  [icon]="'refresh'"
                  (clickEventEmitter)="reset()">
      </app-button>
    </div>
  </div>

  <div class="letters-container-content">
    <div class="letter">
      {{ letter() }}
    </div>
  </div>

  <div class="letters-container-footer">
    <div class="buttons-container gap-30">
      <app-button [icon]="'arrow_back'"
                  [class]="'big'"
                  (clickEventEmitter)="back()">
      </app-button>
      <app-button [icon]="'arrow_forward'"
                  [class]="'big'"
                  (clickEventEmitter)="next()">
      </app-button>
    </div>
  </div>
</div>
